<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Day1 · Cesium 入门：影像底图 + 定位 + 标注</title>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
    #tip { position: absolute; 
      left: 12px; top: 12px;
      z-index: 10;
      background: rgba(0,0,0,.6);
      color: #fff;
      padding: 8px 12px; 
      border-radius: 6px;
      font: 14px/1.5 sans-serif; }
    .cesium-infoBox {
      border-radius: 8px !important;
    }
    .cesium-infoBox-title {
      background: #247ba0 !important;
    }       
  </style>
</head>
<body>
  <div id="tip">Day1：影像底图 + 定位 + 标注（点击地图上的图标看信息框）</div>
  <div id="cesiumContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js"></script>
  <script src="凤凰山config.js"></script>
  <script>
    // Cesium 的 Web Worker 不允许通过 file:// 协议加载，必须走本地 HTTP 服务
    if (window.location.protocol === 'file:') {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:40px;font:18px/1.6 sans-serif;color:#c00;text-align:center;">' +
        '<div><h2>请用本地 HTTP 服务打开本页面</h2>' +
        '<p>Cesium 的 Web Worker 不允许通过 <code>file://</code> 直接打开。</p>' +
        '<p>请在终端执行：<br><code style="background:#f5f5f5;padding:6px 10px;border-radius:4px;">python -m http.server 8081</code></p>' +
        '<p>然后访问：<br><code style="background:#f5f5f5;padding:6px 10px;border-radius:4px;">http://localhost:8081/day1.html</code></p></div></div>';
      throw new Error('Cesium must be loaded over HTTP, not file://');
    }

    // 有令牌就启用（地形/高级影像才需要），没有也能跑
    if (CONFIG.cesiumIonToken) Cesium.Ion.defaultAccessToken = CONFIG.cesiumIonToken;

    const [lon, lat] = CONFIG.center;

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: false,
      geocoder: false,
      animation: false,
      timeline: false,
      navigationHelpButton: false,
      skyBox: false,
      skyAtmosphere: false
    });

    // 默认使用 Esri 卫星影像（CORS 友好、全球可用）；国内用户可换高德，但 localhost 可能因 CORS 黑屏
    viewer.imageryLayers.removeAll();
    viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
  url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  maximumLevel: 18,
  credit: 'Esri',
  enableCrossOrigin: true
}));


    // 相机飞到凤凰山
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, CONFIG.initHeight),
      duration: 2
    });
viewer.scene.requestRender();

    // 示例标注 1：火险中心
    viewer.entities.add({
      name: '火险监测中心',
      position: Cesium.Cartesian3.fromDegrees(lon, lat),
      point: { pixelSize: 12, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
      label: { text: '火险监测中心', font: '14px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -22), fillColor: Cesium.Color.WHITE },
      description: '<b>火险监测中心</b><br/>负责实时采集气象与卫星火点数据。',
    });

    // 示例标注 2：消防站（偏移一点）
    viewer.entities.add({
      name: '凤凰山消防站',
      position: Cesium.Cartesian3.fromDegrees(lon  -  0.009, lat  +  0.002),
      point: { pixelSize: 12, color: Cesium.Color.GREEN, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
      label: { text: '消防站', font: '14px sans-serif', pixelOffset: new Cesium.Cartesian2(0, -22), fillColor: Cesium.Color.WHITE },
      description: '<b>凤凰山消防站</b><br/>进攻路线起点，常驻消防力量。',
    });

    // 新增标注1：森林防火瞭望塔
viewer.entities.add({
  name: '森林防火瞭望塔',
  position: Cesium.Cartesian3.fromDegrees(lon + 0.007, lat + 0.008),
  point: {
    pixelSize: 12,
    color: Cesium.Color.BLUE,
    outlineColor: Cesium.Color.WHITE,
    outlineWidth: 2,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  },
  label: {
    text: '瞭望塔',
    font: '14px sans-serif',
    pixelOffset: new Cesium.Cartesian2(-12, -22),
    fillColor: Cesium.Color.WHITE,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
  },
  description: '<b>森林防火瞭望塔</b><br />人工值守，肉眼观测山林火情，实时上报火情信息。',
});

// 新增标注2：物资补给站
viewer.entities.add({
  name: '物资补给站',
  position: Cesium.Cartesian3.fromDegrees(lon  -  0.006, lat  +  0.002),
  point: {
    pixelSize: 12,
    color: Cesium.Color.YELLOW,
    outlineColor: Cesium.Color.WHITE,
    outlineWidth: 2,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    disableDepthTestDistance: Number.POSITIVE_INFINITY
  },
  label: {
    text: '物资补给站',
    font: '14px sans-serif',
    pixelOffset: new Cesium.Cartesian2(12, -22),
    fillColor: Cesium.Color.WHITE,
    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
  },
  description: '<b>物资补给站</b><br />存放消防水带、灭火器、防护装备，为前线灭火队伍提供物资保障。',
});
  </script>
</body>
</html>
